# Pipeline de integración continua de GOMARKET.
# Corre en cada push y pull request: compila, ejecuta los tests de Java y de
# JavaScript, genera el reporte de cobertura (JaCoCo + node --test) y lo publica
# como artefacto y en el resumen del job.
name: CI

on:
  push:
    branches: [main, "entrega-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 17 · Maven · JaCoCo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compilar, testear y medir cobertura
        run: ./mvnw -B verify

      - name: Resumen de cobertura
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            python3 scripts/ci/resumen_cobertura.py >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-java
          path: target/site/jacoco/

      - name: Publicar resultados de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-java
          path: target/surefire-reports/

      - name: Publicar el WAR
        uses: actions/upload-artifact@v4
        with:
          name: ecommerce-war
          path: target/ecommerce.war

  frontend:
    name: Frontend (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tests de JavaScript con cobertura
        shell: bash   # activa pipefail: si node --test falla, el paso falla aunque después venga tee
        run: |
          node --test --experimental-test-coverage src/test/js/*.test.mjs | tee cobertura-js.txt
          {
            echo "## Cobertura de tests de JavaScript (parcial)"
            echo '```'
            grep -E "^# (tests|pass|fail)|all files|file  " cobertura-js.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-js
          path: cobertura-js.txt
